version: 2

models:
  - name: dim_customers
    description: One row per customer, with order history aggregated from stg_orders.
    columns:
      - name: customer_id
        description: Primary key, sourced from stg_customers.
        tests:
          - unique
          - not_null
      - name: number_of_orders
        description: Count of orders placed by this customer.
        tests:
          - not_null
